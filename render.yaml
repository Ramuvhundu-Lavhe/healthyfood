services:
  - type: web
    name: healthyfood-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node data-server.js
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: JWT_SECRET
        generateValue: true
