name: Deploy to VM

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into VM, pull latest, rebuild, restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          command_timeout: 10m
          script: |
            set -e
            cd ~/healthyfood
            git pull origin main
            cd backend && npm install --omit=dev && cd ..
            cd frontend && npm install && npm run build && cd ..
            pm2 restart healthyfood-api --update-env
            pm2 save
            echo "Deploy OK at $(date -u)"
