<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>HealthyFood Companion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        --navy:          #002F6C;
        --navy-deep:     #001B40;
        --navy-tint:     #E8EEF6;
        --white:         #FFFFFF;
        --bg:            #F4F6FA;
        --teal:          #00A9CE;
        --healthy-green: #1B8A5A;
        --amber:         #E8A317;
        --alert-red:     #C8442E;
        --ink:           #16202C;
        --ink-muted:     #5B6775;
        --line:          #D9E0EA;
        --gold:          #C9A227;
      }
      body {
        background-color: #e5e7eb;
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      }
      ::-webkit-scrollbar {
        width: 0px;
        background: transparent;
      }
      .hide-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .hide-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      
      /* Custom utility classes for repeated card styles */
      .discovery-card {
        background-color: var(--white);
        border-radius: 16px;
        border: 1px solid var(--line);
        box-shadow: 0 4px 12px rgba(0, 47, 108, 0.03);
        padding: 1.25rem;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }
      
      .discovery-btn-primary {
        background-color: var(--navy);
        color: var(--white);
        border-radius: 10px;
        font-weight: 600;
        padding: 0.875rem 1.25rem;
        text-align: center;
        transition: background-color 0.2s, transform 0.1s;
      }
      .discovery-btn-primary:active {
        background-color: var(--navy-deep);
        transform: scale(0.98);
      }
      
      .discovery-btn-secondary {
        background-color: var(--white);
        color: var(--navy);
        border: 1.5px solid var(--navy);
        border-radius: 10px;
        font-weight: 600;
        padding: 0.875rem 1.25rem;
        text-align: center;
        transition: background-color 0.2s, transform 0.1s;
      }
      .discovery-btn-secondary:active {
        background-color: var(--navy-tint);
        transform: scale(0.98);
      }
      
      @keyframes slideUp {
        from { transform: translateY(100%); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      .animate-slide-up {
        animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .animate-fade-in {
        animation: fadeIn 0.2s ease-out forwards;
      }

      .glass-nav {
        background: rgba(0, 47, 108, 0.95);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
      }
    </style>
    <script>
      // Polyfill process.env for browser environment to satisfy strict API key requirements
      window.process = {
        env: {
          API_KEY: 'mock-api-key-replace-in-production'
        }
      };
    </script>
      </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
